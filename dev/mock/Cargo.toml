[package]
name = "zonewright-mock"
version = "0.0.0"
description = "Stateful mock provider APIs for the zonewright test suite. Not published."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "form"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "sync", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
