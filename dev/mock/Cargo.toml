[package]
name = "zonewright-mock"
version = "0.1.0"
description = "Stateful mock DNS provider APIs for testing zonewright and the applications that use it, without live accounts."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dns", "mock", "testing", "zonewright"]
categories = ["development-tools::testing"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "form"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "sync", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
aws-lc-rs = "1.19.0"
base64 = "0.23.1"
roxmltree = "0.21.2"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
